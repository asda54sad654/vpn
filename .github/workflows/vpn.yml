name: VPN Mixed VLESS + VMess + Trojan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir C:\Xray -Force
          cd C:\Xray
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force
          Remove-Item "xray.zip" -Force
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Create Xray Config (VLESS + VMess + Trojan)
        run: |
          cd C:\Xray
          
          $config = @"
          {
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}],
                  "decryption": "none"
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/vless"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "alterId": 0, "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/vmess"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "trojan",
                "settings": {
                  "clients": [
                    {"password": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}
                  ]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/trojan"}}
              }
            ],
            "outbounds": [{"protocol": "freedom"}],
            "policy": {"levels": {"0": {"bufferSize": 10240}}}
          }
          "@
          
          [System.IO.File]::WriteAllText("C:\Xray\config.json", $config)
          Write-Host "Config created: VLESS + VMess + Trojan"

      - name: Open Firewall
        run: |
          netsh advfirewall firewall add rule name="Xray-443" dir=in action=allow protocol=TCP localport=443

      - name: Start Xray
        run: |
          cd C:\Xray
          Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config config.json" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Start Cloudflared
        run: |
          cd C:\Xray
          Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:443 > C:\Xray\cf_out.txt 2> C:\Xray\cf_err.txt" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          
          $log = Get-Content "C:\Xray\cf_out.txt", "C:\Xray\cf_err.txt" -Raw -ErrorAction SilentlyContinue
          $url = $log | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url) {
            Write-Host "URL: $url"
            Write-Output "CLOUDFLARE_URL=$url" >> $env:GITHUB_ENV
          }

      - name: Generate Links
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $serverId = "server1"
          $cloudflareUrl = "$env:CLOUDFLARE_URL"
          
          if ($cloudflareUrl) {
            $domain = $cloudflareUrl -replace '^https://', ''
            
            # VLESS Link
            $vlessLink = "vless://${uuid}@${domain}:443?path=%2Fvless&security=tls&encryption=none&type=ws#Server1_VLESS"
            Write-Host "VLESS: $vlessLink"
            $body = @{ server_id = $serverId; vmess = $vlessLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
            
            # VMess Link
            $json = "{`"add`":`"$domain`",`"aid`":0,`"id`":`"$uuid`",`"net`":`"ws`",`"path`":`"/vmess`",`"port`":443,`"type`":`"none`",`"tls`":`"tls`",`"ps`":`"Server1_VMess`"}"
            $vmessLink = "vmess://" + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
            Write-Host "VMess: $vmessLink"
            $body = @{ server_id = $serverId; vmess = $vmessLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
            
            # Trojan Link
            $trojanLink = "trojan://${uuid}@${domain}:443?path=%2Ftrojan&security=tls&type=ws#Server1_Trojan"
            Write-Host "Trojan: $trojanLink"
            $body = @{ server_id = $serverId; vmess = $trojanLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
            
            Write-Host "✅ All 3 links sent!"
          }

      - name: Keep Alive
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            
            $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue
            if (-not $xray) {
              Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config C:\Xray\config.json" -WindowStyle Hidden
            }
            
            $cf = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
            if (-not $cf) {
              Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:443 > C:\Xray\cf_out.txt 2> C:\Xray\cf_err.txt" -WindowStyle Hidden
            }
            
            Write-Host "[$i/360] Alive"
          }