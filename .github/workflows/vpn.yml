name: SS Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install
        run: |
          mkdir -p ss
          cd ss
          wget -qO ss.tar.xz "https://github.com/shadowsocks/shadowsocks-rust/releases/latest/download/shadowsocks-v1.21.0.x86_64-unknown-linux-gnu.tar.xz"
          tar -xJf ss.tar.xz
          chmod +x ss-server
          wget -qO cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          echo "✅ Done"

      - name: Config
        run: |
          cd ss
          cat > config.json << 'EOF'
          {
            "server": "0.0.0.0",
            "server_port": 8388,
            "password": "5aa2ebe1-5114-4bc3-aefa-935807433e70",
            "method": "aes-256-gcm",
            "fast_open": false,
            "mode": "tcp_only"
          }
          EOF

      - name: Run SS
        run: |
          cd ss
          ./ss-server -c config.json &
          sleep 3
          pgrep ss-server || exit 1

      - name: Run CF
        run: |
          cd ss
          ./cloudflared tunnel --url http://localhost:8388 --protocol http2 &
          sleep 15

      - name: Get Link
        run: |
          cd ss
          URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' | head -1)
          if [ -z "$URL" ]; then
            echo "No URL found"
            exit 1
          fi
          DOMAIN=$(echo $URL | sed 's|https://||')
          echo "ss://$(echo -n "aes-256-gcm:5aa2ebe1-5114-4bc3-aefa-935807433e70@${DOMAIN}:443" | base64 -w 0)"