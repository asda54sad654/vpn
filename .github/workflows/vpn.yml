name: VPN with Worker + Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir C:\Xray -Force
          cd C:\Xray
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force
          Remove-Item "xray.zip" -Force
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Create Xray Config
        run: |
          cd C:\Xray
          $config = '{"inbounds":[{"listen":"0.0.0.0","port":443,"protocol":"vless","settings":{"clients":[{"id":"5aa2ebe1-5114-4bc3-aefa-935807433e70","email":"user1"}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/"}}}],"outbounds":[{"protocol":"freedom"}]}'
          [System.IO.File]::WriteAllText("C:\Xray\config.json", $config)

      - name: Open Firewall
        run: |
          netsh advfirewall firewall add rule name="Xray-443" dir=in action=allow protocol=TCP localport=443

      - name: Start Xray
        run: |
          cd C:\Xray
          Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config config.json" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Start Cloudflared
        run: |
          cd C:\Xray
          Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:443 > C:\Xray\cf_out.txt 2> C:\Xray\cf_err.txt" -WindowStyle Hidden
          Start-Sleep -Seconds 20
          
          $log = Get-Content "C:\Xray\cf_out.txt", "C:\Xray\cf_err.txt" -Raw -ErrorAction SilentlyContinue
          $url = $log | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url) {
            Write-Host "Cloudflare URL: $url"
            Write-Output "CLOUDFLARE_URL=$url" >> $env:GITHUB_ENV
          }

      - name: Auto Update Worker
        run: |
          $cloudflareUrl = "$env:CLOUDFLARE_URL"
          $apiToken = "${{ secrets.CF_API_TOKEN }}"
          $accountId = "e96a2dd0c1de68077e282bab0f5e64af"
          $workerName = "my-vpn-worker"
          
          $workerCode = "addEventListener('fetch', event => {`n  event.respondWith(handleRequest(event.request))`n})`n`nasync function handleRequest(request) {`n  const url = new URL(request.url);`n  const targetUrl = '$cloudflareUrl';`n  const newUrl = targetUrl + url.pathname + url.search;`n  return fetch(new Request(newUrl, {`n    method: request.method,`n    headers: request.headers,`n    body: request.body`n  }));`n}"
          
          [System.IO.File]::WriteAllText("C:\Xray\worker.js", $workerCode)
          
          $response = & curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$accountId/workers/scripts/$workerName" -H "Authorization: Bearer $apiToken" -H "Content-Type: application/javascript" --data-binary "@C:\Xray\worker.js"
          
          if ($response -match '"success":true') {
            Write-Host "Worker updated"
          } else {
            Write-Host "Failed: $response"
          }

      - name: Generate VLESS Link
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $workerDomain = "my-vpn-worker.hosseinderees7.workers.dev"
          
          $vlessLink = "vless://${uuid}@${workerDomain}:443?path=/&security=tls&encryption=none&type=ws#Server2_VLESS_Worker"
          
          Write-Host "Link: $vlessLink"
          
          $body = @{ server_id = "server2"; vmess = $vlessLink } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"

      - name: Keep Alive
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue
            $cf = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
            if (-not $xray) { Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config C:\Xray\config.json" -WindowStyle Hidden }
            if (-not $cf) { Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:443 > C:\Xray\cf_out.txt 2> C:\Xray\cf_err.txt" -WindowStyle Hidden }
            Write-Host "[$i/360] Alive"
          }