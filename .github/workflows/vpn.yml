name: VLESS VPN with Subdomain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray
        run: |
          mkdir -p xray
          cd xray
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q xray.zip
          rm xray.zip
          chmod +x xray
          echo "✅ Xray installed"

      - name: Create Xray Config (VLESS + WebSocket + TLS)
        run: |
          cd xray
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          
          cat <<EOF > config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "${UUID}"}],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {"path": "/"}
                }
              }
            ],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF
          echo "✅ Config created"

      - name: Start Xray
        run: |
          cd xray
          ./xray run -config config.json &
          sleep 5
          if pgrep -f "xray run" > /dev/null; then
            echo "✅ Xray started on port 8080"
          else
            echo "❌ Xray failed"
            exit 1
          fi

      - name: Show VLESS Link
        run: |
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          DOMAIN="udududu.miradig.ir"
          
          VLESS_LINK="vless://${UUID}@${DOMAIN}:443?path=%2F&security=tls&encryption=none&type=ws&sni=${DOMAIN}#VLESS_WS"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ VLESS + WebSocket + TLS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔹 لینک VLESS:"
          echo "$VLESS_LINK"
          echo ""
          echo "🔹 تنظیمات دستی:"
          echo "   پروتکل: VLESS"
          echo "   آدرس: $DOMAIN"
          echo "   پورت: 443"
          echo "   UUID: $UUID"
          echo "   Network: ws"
          echo "   Path: /"
          echo "   TLS: فعال"
          echo "   SNI: $DOMAIN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Keep Alive
        run: |
          cd xray
          for i in {1..360}; do
            sleep 60
            if ! pgrep -f "xray run" > /dev/null; then
              ./xray run -config config.json &
            fi
            echo "[$i/360] Alive"
          done