name: VPN Mixed VLESS + VMess + Trojan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir C:\Xray -Force
          cd C:\Xray
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force
          Remove-Item "xray.zip" -Force
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Create Xray Config (3 Separate Ports)
        run: |
          cd C:\Xray
          
          $config = @"
          {
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}],
                  "decryption": "none"
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2053,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "alterId": 0, "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2083,
                "protocol": "trojan",
                "settings": {
                  "clients": [{"password": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              }
            ],
            "outbounds": [{"protocol": "freedom"}],
            "policy": {"levels": {"0": {"bufferSize": 10240}}}
          }
          "@
          
          [System.IO.File]::WriteAllText("C:\Xray\config.json", $config)
          Write-Host "Config created"

      - name: Open Firewall
        run: |
          $ports = @(443, 2053, 2083)
          foreach ($port in $ports) {
            netsh advfirewall firewall add rule name="Xray-$port" dir=in action=allow protocol=TCP localport=$port
          }

      - name: Start Xray
        run: |
          cd C:\Xray
          Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config config.json" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Start Cloudflared for Each Port
        run: |
          cd C:\Xray
          $ports = @(443, 2053, 2083)
          foreach ($port in $ports) {
            Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt" -WindowStyle Hidden
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 20

      - name: Generate Links
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $serverId = "server2"
          
          # VLESS - Port 443
          $log443 = Get-Content "C:\Xray\cf_out_443.txt", "C:\Xray\cf_err_443.txt" -Raw -ErrorAction SilentlyContinue
          $url443 = $log443 | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url443) {
            $domain443 = $url443 -replace '^https://', ''
            $vlessLink = "vless://${uuid}@${domain443}:443?path=/&security=tls&encryption=none&type=ws#Server2_VLESS"
            Write-Host "VLESS: $vlessLink"
            $body = @{ server_id = $serverId; vmess = $vlessLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
          }
          
          # VMess - Port 2053
          $log2053 = Get-Content "C:\Xray\cf_out_2053.txt", "C:\Xray\cf_err_2053.txt" -Raw -ErrorAction SilentlyContinue
          $url2053 = $log2053 | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url2053) {
            $domain2053 = $url2053 -replace '^https://', ''
            $json = "{`"add`":`"$domain2053`",`"aid`":0,`"id`":`"$uuid`",`"net`":`"ws`",`"path`":`"/`",`"port`":2053,`"type`":`"none`",`"tls`":`"tls`",`"ps`":`"Server2_VMess`"}"
            $vmessLink = "vmess://" + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
            Write-Host "VMess: $vmessLink"
            $body = @{ server_id = $serverId; vmess = $vmessLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
          }
          
          # Trojan - Port 2083
          $log2083 = Get-Content "C:\Xray\cf_out_2083.txt", "C:\Xray\cf_err_2083.txt" -Raw -ErrorAction SilentlyContinue
          $url2083 = $log2083 | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url2083) {
            $domain2083 = $url2083 -replace '^https://', ''
            $trojanLink = "trojan://${uuid}@${domain2083}:2083?path=/&security=tls&type=ws#Server2_Trojan"
            Write-Host "Trojan: $trojanLink"
            $body = @{ server_id = $serverId; vmess = $trojanLink } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
          }
          
          Write-Host "✅ All links sent!"

      - name: Keep Alive
        run: |
          $ports = @(443, 2053, 2083)
          
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            
            $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue
            if (-not $xray) {
              Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config C:\Xray\config.json" -WindowStyle Hidden
            }
            
            $cfCount = (Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue).Count
            if ($cfCount -lt $ports.Count) {
              foreach ($port in $ports) {
                Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt" -WindowStyle Hidden
              }
            }
            
            Write-Host "[$i/360] Alive"
          }