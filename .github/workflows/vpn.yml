name: VPN Mixed VLESS + VMess

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir C:\Xray -Force
          cd C:\Xray
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force
          Remove-Item "xray.zip" -Force
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Create Xray Config (3 VLESS + 3 VMess)
        run: |
          cd C:\Xray
          
          $config = @"
          {
            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}],
                  "decryption": "none"
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2053,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}],
                  "decryption": "none"
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2083,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "email": "user1"}],
                  "decryption": "none"
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2087,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "alterId": 0, "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 2096,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "alterId": 0, "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              },
              {
                "listen": "0.0.0.0",
                "port": 8443,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "5aa2ebe1-5114-4bc3-aefa-935807433e70", "alterId": 0, "email": "user1"}]
                },
                "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}
              }
            ],
            "outbounds": [{"protocol": "freedom"}],
            "policy": {"levels": {"0": {"bufferSize": 10240}}}
          }
          "@
          
          [System.IO.File]::WriteAllText("C:\Xray\config.json", $config)
          Write-Host "Config created: 3 VLESS + 3 VMess"

      - name: Open Firewall
        run: |
          $ports = @(443, 2053, 2083, 2087, 2096, 8443)
          foreach ($port in $ports) {
            netsh advfirewall firewall add rule name="Xray-$port" dir=in action=allow protocol=TCP localport=$port
          }

      - name: Start Xray
        run: |
          cd C:\Xray
          Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config config.json" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Start Cloudflared
        run: |
          cd C:\Xray
          $ports = @(443, 2053, 2083, 2087, 2096, 8443)
          foreach ($port in $ports) {
            Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt" -WindowStyle Hidden
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 20

      - name: Generate Mixed Links
        run: |
          $uuid = "5aa2ebe1-5114-4bc3-aefa-935807433e70"
          $secret = "fasjfajf09wjf9jawfj0j"
          $serverId = "server1"
          
          # VLESS Ports
          $vlessPorts = @(443, 2053, 2083)
          # VMess Ports
          $vmessPorts = @(2087, 2096, 8443)
          
          $vlessIndex = 1
          $vmessIndex = 1
          
          # Generate VLESS Links
          foreach ($port in $vlessPorts) {
            $log = Get-Content "C:\Xray\cf_out_$port.txt", "C:\Xray\cf_err_$port.txt" -Raw -ErrorAction SilentlyContinue
            $url = $log | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
            
            if ($url) {
              $domain = $url -replace '^https://', ''
              $ps = "Server1_VLESS_$vlessIndex"
              $vlessLink = "vless://${uuid}@${domain}:${port}?path=/&security=tls&encryption=none&type=ws#${ps}"
              
              Write-Host "VLESS $vlessIndex (Port $port): $vlessLink"
              
              $body = @{ server_id = $serverId; vmess = $vlessLink } | ConvertTo-Json
              Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
              $vlessIndex++
            }
          }
          
          # Generate VMess Links
          foreach ($port in $vmessPorts) {
            $log = Get-Content "C:\Xray\cf_out_$port.txt", "C:\Xray\cf_err_$port.txt" -Raw -ErrorAction SilentlyContinue
            $url = $log | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
            
            if ($url) {
              $domain = $url -replace '^https://', ''
              $ps = "Server1_VMess_$vmessIndex"
              $json = "{`"add`":`"$domain`",`"aid`":0,`"id`":`"$uuid`",`"net`":`"ws`",`"path`":`"/`",`"port`":$port,`"type`":`"none`",`"tls`":`"tls`",`"ps`":`"$ps`"}"
              $vmessLink = "vmess://" + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
              
              Write-Host "VMess $vmessIndex (Port $port): $vmessLink"
              
              $body = @{ server_id = $serverId; vmess = $vmessLink } | ConvertTo-Json
              Invoke-RestMethod -Uri "https://miradig.ir/update" -Method Post -Headers @{ Authorization = "Bearer $secret" } -Body $body -ContentType "application/json"
              $vmessIndex++
            }
          }

      - name: Keep Alive
        run: |
          $ports = @(443, 2053, 2083, 2087, 2096, 8443)
          
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            
            $xray = Get-Process -Name "xray" -ErrorAction SilentlyContinue
            if (-not $xray) {
              Start-Process -FilePath "C:\Xray\xray.exe" -ArgumentList "-config C:\Xray\config.json" -WindowStyle Hidden
            }
            
            $cfCount = (Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue).Count
            if ($cfCount -lt $ports.Count) {
              foreach ($port in $ports) {
                Start-Process cmd -ArgumentList '/c', "C:\Xray\cloudflared.exe tunnel --url localhost:$port > C:\Xray\cf_out_$port.txt 2> C:\Xray\cf_err_$port.txt" -WindowStyle Hidden
              }
            }
            
            Write-Host "[$i/360] Alive - Xray: $(if($xray){'OK'}else{'Restarted'}) | CF: $cfCount/$($ports.Count)"
          }