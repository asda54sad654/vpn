name: VPN - Trojan + VLESS + Trojan Worker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Xray and Cloudflared
        run: |
          mkdir -p xray
          cd xray
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -q xray.zip
          rm xray.zip
          wget -qO cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x xray cloudflared
          echo "✅ Installed"

      - name: Create Xray Config
        run: |
          cd xray
          PASSWORD="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"

          cat > config.json <<EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {"listen": "0.0.0.0", "port": 8080, "protocol": "trojan", "settings": {"clients": [{"password": "${PASSWORD}"}]}, "streamSettings": {"network": "ws", "wsSettings": {"path": "/trojan"}}},
              {"listen": "0.0.0.0", "port": 8081, "protocol": "vless", "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"}, "streamSettings": {"network": "ws", "wsSettings": {"path": "/vless"}}},
              {"listen": "0.0.0.0", "port": 8082, "protocol": "trojan", "settings": {"clients": [{"password": "${PASSWORD}"}]}, "streamSettings": {"network": "ws", "wsSettings": {"path": "/"}}}
            ],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF
          echo "✅ Config created"

      - name: Start Xray
        run: |
          cd xray
          ./xray run -config config.json > xray.log 2>&1 &
          sleep 5
          if pgrep -f "xray run" > /dev/null; then echo "✅ Xray started"; else echo "❌ Failed"; exit 1; fi

      - name: Start Trojan Cloudflared
        run: |
          cd xray
          ./cloudflared tunnel --url http://127.0.0.1:8080 > trojan_cf_out.txt 2> trojan_cf_err.txt &
          sleep 5

      - name: Start VLESS Cloudflared
        run: |
          cd xray
          ./cloudflared tunnel --url http://127.0.0.1:8081 > vless_cf_out.txt 2> vless_cf_err.txt &
          sleep 5

      - name: Start Worker Cloudflared
        run: |
          cd xray
          ./cloudflared tunnel --url http://127.0.0.1:8082 > worker_cf_out.txt 2> worker_cf_err.txt &
          sleep 8

      - name: Get URLs
        run: |
          cd xray
          sleep 5

          TROJAN_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' trojan_cf_err.txt | head -n 1)
          VLESS_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' vless_cf_err.txt | head -n 1)
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' worker_cf_err.txt | head -n 1)

          echo "TROJAN_URL=$TROJAN_URL" >> "$GITHUB_ENV"
          echo "VLESS_URL=$VLESS_URL" >> "$GITHUB_ENV"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

          echo "Trojan: $TROJAN_URL"
          echo "VLESS: $VLESS_URL"
          echo "Worker: $WORKER_URL"

      - name: Update Worker
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN_VMESS }}
        run: |
          cd xray
          ACC1="e96a2dd0c1de68077e282bab0f5e64af"

          CODE=$(cat <<EOF
          addEventListener('fetch', event => { event.respondWith(handleRequest(event.request)); });
          async function handleRequest(request) {
            const url = new URL(request.url);
            const target = new URL('${WORKER_URL}');
            url.hostname = target.hostname;
            url.protocol = target.protocol;
            return fetch(new Request(url, request));
          }
          EOF
          )

          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACC1}/workers/scripts/my-vpn-worker" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/javascript" --data-raw "$CODE"
          echo "✅ Worker updated"

      - name: Generate 7 Links (3 Trojan + 3 VLESS + 1 Worker)
        run: |
          PASSWORD="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          UUID="5aa2ebe1-5114-4bc3-aefa-935807433e70"
          SERVER_ID="server2"
          SECRET="fasjfajf09wjf9jawfj0j"

          TROJAN_DOMAIN=$(echo "$TROJAN_URL" | sed 's|https://||')
          VLESS_DOMAIN=$(echo "$VLESS_URL" | sed 's|https://||')
          WORKER_DOMAIN="my-vpn-worker.hosseinderees7.workers.dev"

          TROJAN_PORTS=(443 2053 2083)
          VLESS_PORTS=(443 2096 8443)

          echo ""
          echo "========== TROJAN TUNNEL LINKS =========="
          for PORT in "${TROJAN_PORTS[@]}"; do
            LINK="trojan://${PASSWORD}@${TROJAN_DOMAIN}:${PORT}?path=%2Ftrojan&security=tls&type=ws#Trojan_${PORT}"
            curl -s -X POST "https://miradig.ir/update" -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK\"}"
            echo "✅ Trojan $PORT sent"
          done

          echo ""
          echo "========== VLESS TUNNEL LINKS =========="
          for PORT in "${VLESS_PORTS[@]}"; do
            LINK="vless://${UUID}@${VLESS_DOMAIN}:${PORT}?path=%2Fvless&security=tls&encryption=none&type=ws#VLESS_${PORT}"
            curl -s -X POST "https://miradig.ir/update" -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$LINK\"}"
            echo "✅ VLESS $PORT sent"
          done

          echo ""
          echo "========== WORKER LINK =========="
          WORKER_LINK="trojan://${PASSWORD}@${WORKER_DOMAIN}:443?path=/&security=tls&type=ws#Trojan_Worker"
          curl -s -X POST "https://miradig.ir/update" -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "{\"server_id\":\"$SERVER_ID\",\"vmess\":\"$WORKER_LINK\"}"
          echo "✅ Worker sent"

          echo ""
          echo "=========================================="
          echo "✅ ALL 7 LINKS SENT!"
          echo "=========================================="

      - name: Keep Alive
        run: |
          cd xray
          for i in {1..360}; do
            sleep 60
            if ! pgrep -f "xray run" > /dev/null; then
              ./xray run -config config.json > xray.log 2>&1 &
              sleep 3
            fi
            if ! pgrep -f "cloudflared tunnel.*8080" > /dev/null; then
              ./cloudflared tunnel --url http://127.0.0.1:8080 > trojan_cf_out.txt 2> trojan_cf_err.txt &
            fi
            if ! pgrep -f "cloudflared tunnel.*8081" > /dev/null; then
              ./cloudflared tunnel --url http://127.0.0.1:8081 > vless_cf_out.txt 2> vless_cf_err.txt &
            fi
            if ! pgrep -f "cloudflared tunnel.*8082" > /dev/null; then
              ./cloudflared tunnel --url http://127.0.0.1:8082 > worker_cf_out.txt 2> worker_cf_err.txt &
            fi
            echo "[$i/360] Alive"
          done